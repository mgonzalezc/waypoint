name: waypoint
description: "An AI travel ranking app: natural-language query in, up to 10 ranked results out, each with a reasoned, sourced explanation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Networking (repositories wrap this, never used directly from ui/)
  dio: ^5.7.0

  # State management + DI
  flutter_riverpod: ^2.6.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  amplitude_flutter: ^4.7.1
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  # Fonts bundled as assets (not google_fonts runtime-fetch) so golden tests
  # never depend on a network call.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo-Variable.ttf
          weight: 900
    - family: Onest
      fonts:
        - asset: assets/fonts/onest/Onest-Variable.ttf
          weight: 400
        - asset: assets/fonts/onest/Onest-Variable.ttf
          weight: 600
